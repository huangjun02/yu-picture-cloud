server:
  port: 8123
  servlet:
    context-path: /api

spring:
  application:
    name: yu-picture-cloud
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

mybatis-plus:
  configuration:
    # 必须 false —— 这个开关在 MyBatis-Plus 里是"双向"的：
    #   ① 结果集映射：列 user_account → 属性 userAccount
    #   ② 反推列名：属性 userAccount → 列名 user_account   ← 坑在这
    # 本项目 DDL 的列名本身就是驼峰（userAccount），一旦开成 true，
    # MP 会拿 user_account 去查库 → java.sql.SQLSyntaxErrorException: Unknown column 'user_account'
    # 源码位置：TableInfo#underCamel = configuration.isMapUnderscoreToCamelCase()
    #           TableInfoHelper: if (underCamel) column = StringUtils.camelToUnderline(column)
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      # 逻辑删除：不真删数据，只把 isDelete 从 0 改成 1
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: satoken
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: uuid

knife4j:
  enable: true
  openapi:
    title: 云图库接口文档
    version: 1.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.huang.yupicture.controller
